name: CD — Publish images (GHCR)

# Manual deploy atau otomatis saat push tag semver (v1.0.0).
# Image: ghcr.io/<owner>/tonghong-web:<tag> dan tonghong-backend:<tag>

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag image (mis. latest, v1.0.0)"
        required: true
        default: latest
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          # Docker tag must be 1-128 chars and only [A-Za-z0-9_.-], not starting with . or -
          if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag: '$tag'"
            echo "Allowed pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$"
            exit 1
          fi

          echo "value=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: GHCR namespace (lowercase)
        id: gh
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push — frontend (nginx)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.gh.outputs.owner_lc }}/tonghong-web:${{ needs.validate.outputs.tag }}

      - name: Build & push — backend (FastAPI)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.gh.outputs.owner_lc }}/tonghong-backend:${{ needs.validate.outputs.tag }}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# DNS Docker agar setelah restart container IP upstream tidak stale (kurangi 502 sementara).
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name _;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # API → backend
    location /api/ {
        set $upstream_api http://backend:8000;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /health {
        set $upstream_health http://backend:8000;
        proxy_pass $upstream_health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend + WebSocket HMR → Vite dev server
    location / {
        set $upstream_vite http://frontend-dev:5173;
        proxy_pass $upstream_vite;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    privileged: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    command:
      - mariadbd
      - --socket=/run/mysqld/mysqld.sock
      - --pid-file=/run/mysqld/mysqld.pid
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-tonghong}
      MARIADB_USER: ${MYSQL_USER:-tonghong}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-tonghong_secret}
    expose:
      - "3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    tmpfs:
      - /run/mysqld:rw,uid=999,gid=999,mode=0775
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u${MYSQL_USER:-tonghong} -p${MYSQL_PASSWORD:-tonghong_secret} --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    privileged: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-tonghong}:${MYSQL_PASSWORD:-tonghong_secret}@mariadb:3306/${MYSQL_DATABASE:-tonghong}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081,https://tonghong.creativedigitalsolutions.id}
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./dokumentasi:/app/dokumentasi:ro
    command: >
      sh -c "alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --loop asyncio"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 120s

  # Dev backend + auto reload: docker compose --profile dev up backend-dev
  backend-dev:
    profiles: ["dev"]
    build: ./backend
    restart: unless-stopped
    privileged: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ports:
      - "${BACKEND_PORT_DEV:-8001}:8000"
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-tonghong}:${MYSQL_PASSWORD:-tonghong_secret}@mariadb:3306/${MYSQL_DATABASE:-tonghong}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080,http://localhost:8001,http://127.0.0.1:8001,http://localhost:8081,http://127.0.0.1:8081,https://tonghong.creativedigitalsolutions.id}
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./dokumentasi:/app/dokumentasi:ro
    command: >
      sh -c "alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --loop asyncio"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3).read(64)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    privileged: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Dev reverse proxy untuk domain + HMR (WebSocket).
  # Cloudflare Orange Cloud (Flexible): origin HTTP biasanya ke port 80 host — set WEB_HMR_PORT=80 jika tidak ada reverse proxy lain di :80.
  # Tanpa itu, pakai Tunnel ke http://HOST_IP:8081 atau reverse proxy host :80 -> :8081.
  web-hmr:
    profiles: ["dev"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    privileged: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ports:
      - "${WEB_HMR_PORT:-8081}:80"
    volumes:
      - ./frontend/nginx.hmr.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend-dev:
        condition: service_healthy
      backend-dev:
        condition: service_healthy

  # Dev + HMR: docker compose --profile dev up frontend-dev
  frontend-dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 300s
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY: http://backend-dev:8000
      # Akses lewat domain + HTTPS (Cloudflare): host publik & origin harus sama dengan URL browser
      VITE_HMR_HOST: ${HMR_PUBLIC_HOST:-tonghong.creativedigitalsolutions.id}
      VITE_HMR_PROTOCOL: ${HMR_WSS_PROTOCOL:-wss}
      VITE_HMR_PORT: "5173"
      VITE_HMR_CLIENT_PORT: ${HMR_PUBLIC_CLIENT_PORT:-443}
      VITE_DEV_PUBLIC_ORIGIN: ${VITE_DEV_PUBLIC_ORIGIN:-https://tonghong.creativedigitalsolutions.id}
    depends_on:
      - backend-dev

volumes:
  mariadb_data:
  frontend_node_modules:

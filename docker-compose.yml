services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    privileged: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    command:
      - mariadbd
      - --socket=/run/mysqld/mysqld.sock
      - --pid-file=/run/mysqld/mysqld.pid
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-tonghong}
      MARIADB_USER: ${MYSQL_USER:-tonghong}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-tonghong_secret}
    expose:
      - "3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    tmpfs:
      - /run/mysqld:rw,uid=999,gid=999,mode=0775
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u${MYSQL_USER:-tonghong} -p${MYSQL_PASSWORD:-tonghong_secret} --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    privileged: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-tonghong}:${MYSQL_PASSWORD:-tonghong_secret}@mariadb:3306/${MYSQL_DATABASE:-tonghong}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080}
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --loop asyncio"

  # Dev backend + auto reload: docker compose --profile dev up backend-dev
  backend-dev:
    profiles: ["dev"]
    build: ./backend
    restart: unless-stopped
    privileged: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ports:
      - "${BACKEND_PORT_DEV:-8001}:8000"
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-tonghong}:${MYSQL_PASSWORD:-tonghong_secret}@mariadb:3306/${MYSQL_DATABASE:-tonghong}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080,http://localhost:8001,http://127.0.0.1:8001}
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --loop asyncio"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    privileged: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

  # Dev reverse proxy for domain-style access with HMR support (WebSocket)
  web-hmr:
    profiles: ["dev"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    privileged: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    # Port terpisah dari `web` agar prod (8080) + dev HMR bisa jalan bersamaan
    ports:
      - "${WEB_HMR_PORT:-8081}:80"
    volumes:
      - ./frontend/nginx.hmr.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend-dev
      - backend-dev

  # Dev + HMR: docker compose --profile dev up frontend-dev
  frontend-dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY: http://backend-dev:8000
      VITE_HMR_HOST: tonghong.creativedigitalsolutions.id
      VITE_HMR_PROTOCOL: wss
      VITE_HMR_PORT: "5173"
      VITE_HMR_CLIENT_PORT: "443"
    depends_on:
      - backend-dev

volumes:
  mariadb_data:
  frontend_node_modules:
